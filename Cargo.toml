[package]
name = "tiny-hnsw"
version = "1.8.2"
edition = "2024"
authors = ["ronakgh {ronakgh97@gmail.com}"]
description = "A simplified implementation of the HNSW (Hierarchical Navigable Small World) algorithm for efficient approximate nearest neighbor search."
license = "MIT"
repository = "https://github.com/ronakgh97/hnsw-rs"
readme = "README.md"
categories = ["data-structures", "mathematics", "algorithms", "science"]
keywords = ["hnsw", "nearest-neighbor", "search", "proxy-graph", "simd"]

[lib]
name = "hnsw_rs"
path = "src/lib.rs"

[[bench]]
name = "32bit"
path = "bench/f32.rs"
harness = false
test = false
doctest = false

[[bench]]
name = "8bit"
path = "bench/i8.rs"
harness = false
test = false
doctest = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 1
debug = true

[dependencies]
wincode = { version = "0.6.3", features = ["derive"] }
memmap2 = "0.9.11"
ahash = "0.8.13"
rayon = "1.12.0"
sha2 = "0.11.1"
anyhow = "1.0.105"
hex = "0.4.3"
fastrand = "2.5.0"

[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
wide = "1.7.1"

[dev-dependencies]
arrow = "60.2.0"
parquet = "60.2.0"
plotters = "0.3.7"